<p-toast />

<p-dialog
  [(visible)]="visivel"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '450px', maxWidth: '95vw' }"
  [contentStyle]="{ 'max-height': '75vh', overflow: 'auto' }"
  styleClass="border-none shadow-2xl rounded-xl overflow-hidden"
>
  <ng-template pTemplate="header">
    <div class="w-full bg-blue-950 px-8 py-8 flex items-center justify-between mb-0">
      <h2 class="text-white text-xl font-bold m-0">Início da Prova</h2>
      <button
        (click)="fechar()"
        class="text-gray-300 hover:text-orange-500 transition-colors cursor-pointer bg-transparent border-none"
      >
        <i class="pi pi-times text-xl"></i>
      </button>
    </div>
  </ng-template>

  <div class="p-6 bg-white flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="nome" class="text-blue-950 font-bold text-sm">Nome completo</label>
      <input
        id="nome"
        type="text"
        [(ngModel)]="nome"
        placeholder="Digite seu nome completo"
        class="w-full px-4 py-3 text-base text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500 transition-shadow"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="idade" class="text-blue-950 font-bold text-sm">Idade</label>
      <input
        id="idade"
        type="number"
        min="15"
        max="100"
        [(ngModel)]="idade"
        placeholder="Ex: 21"
        class="w-full px-4 py-3 text-base text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500 transition-shadow"
      />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label for="sexo" class="text-blue-950 font-bold text-sm">Sexo</label>
        <select
          id="sexo"
          [(ngModel)]="sexo"
          class="w-full px-3 py-3 text-base text-gray-800 bg-white border border-gray-300 rounded-md focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500 transition-shadow"
        >
          <option value="" disabled>Selecione...</option>
          <option value="MASCULINO">Masculino</option>
          <option value="FEMININO">Feminino</option>
          <option value="OUTRO">Outro</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label for="escolaridade" class="text-blue-950 font-bold text-sm">Escolaridade</label>
        <select
          id="escolaridade"
          [(ngModel)]="escolaridade"
          class="w-full px-3 py-3 text-base text-gray-800 bg-white border border-gray-300 rounded-md focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500 transition-shadow"
        >
          <option value="" disabled>Selecione...</option>
          <option value="FUNDAMENTAL">Fundamental</option>
          <option value="MEDIO">Médio</option>
          <option value="SUPERIOR">Superior</option>
        </select>
      </div>
    </div>

    <fieldset class="flex flex-col gap-2 border-none p-0 m-0">
      <legend class="text-blue-950 font-bold text-sm mb-2">
        Qual sua experiência com metodologias ágeis?
      </legend>

      @for (nivel of niveis; track nivel.value) {
        <label
          class="flex items-center gap-3 px-4 py-2.5 border rounded-md cursor-pointer transition-all hover:border-orange-400 has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-orange-500"
          [class.border-orange-500]="experiencia === nivel.value"
          [class.bg-orange-50]="experiencia === nivel.value"
          [class.border-gray-300]="experiencia !== nivel.value"
        >
          <input
            type="radio"
            name="experiencia"
            class="sr-only"
            [value]="nivel.value"
            [(ngModel)]="experiencia"
          />

          <span
            class="w-4 h-4 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors"
            [class.border-orange-500]="experiencia === nivel.value"
            [class.border-gray-400]="experiencia !== nivel.value"
          >
            @if (experiencia === nivel.value) {
              <span class="w-2 h-2 rounded-full bg-orange-500"></span>
            }
          </span>

          <span
            class="text-sm"
            [class.text-blue-950]="experiencia === nivel.value"
            [class.font-semibold]="experiencia === nivel.value"
            [class.text-gray-700]="experiencia !== nivel.value"
          >
            {{ nivel.label }}
          </span>
        </label>
      }
    </fieldset>

    <button
      (click)="iniciarProva()"
      [disabled]="!formularioValido || carregando"
      class="mt-2 w-full bg-orange-500 hover:bg-orange-600 text-white font-bold text-lg py-3 rounded-md transition-all shadow-md cursor-pointer border-none flex justify-center items-center gap-2 disabled:bg-orange-200 disabled:text-orange-50 disabled:cursor-not-allowed disabled:shadow-none"
    >
      <i class="pi" [class.pi-check-circle]="!carregando" [class.pi-spinner]="carregando" [class.pi-spin]="carregando"></i>
      {{ carregando ? 'Iniciando...' : 'Iniciar Prova' }}
    </button>
  </div>
</p-dialog>
